# 1. PUERTO OBLIGATORIO DE CLOUD RUN
server.port=${PORT:8080}

# 2. DATOS DE LA APLICACIÓN
spring.application.name=Biblioteca

# 3. CONFIGURACIÓN DE CLOUD SQL (PostgreSQL)
# Es más robusto usar la URL completa inyectada por Cloud Run en lugar de la configuración GCP
# Pero si usas el starter de GCP, esta configuración es correcta:
spring.cloud.gcp.sql.instance-connection-name=${CLOUD_SQL_CONNECTION_NAME}
spring.cloud.gcp.sql.database-name=${DB_NAME}

# 4. CREDENCIALES (Inyectadas como variables de entorno)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 5. DRIVER DE POSTGRESQL (CRÍTICO)
spring.datasource.driver-class-name=org.postgresql.Driver

# 6. JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CRÍTICO: DIALECTO DE POSTGRESQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect