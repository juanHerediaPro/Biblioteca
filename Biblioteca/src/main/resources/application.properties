# 1. PUERTO OBLIGATORIO DE CLOUD RUN
server.port=${PORT:8080}

# 2. DATOS DE LA APLICACIÓN
spring.application.name=Biblioteca

# 3. CONFIGURACIÓN OPTIMIZADA DE CLOUD SQL CON EL STARTER DE GCP (POSTGRESQL)
spring.cloud.gcp.sql.instance-connection-name=practica2-477009:us-central1:id-postgres-bd
spring.cloud.gcp.sql.database-name=${DB_NAME:biblioteca}

# 4. CREDENCIALES: BUSCA LO QUE INYECTA SECRET MANAGER
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 5. DRIVER DE POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver

# 6. JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CRÍTICO: DIALECTO DE POSTGRESQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect